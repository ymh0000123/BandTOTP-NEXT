<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>BandTOTP-NEXT · Aegis 导入器</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b0d;
    --card: #17171a;
    --line: #2a2a2e;
    --text: #f2f2f7;
    --muted: #8e8e93;
    --accent: #33d17a;
    --warn: #ffb020;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -200px, #1d2b24 0, var(--bg) 60%);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }
  h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: .2px; }
  .sub { margin: 0 0 22px; color: var(--muted); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .drop {
    display: block;
    border: 1.5px dashed #3a3a40;
    border-radius: 14px;
    padding: 30px 18px;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop.dragover { border-color: var(--accent); background: rgba(51, 209, 122, .06); }
  .drop strong { display: block; color: var(--text); margin-bottom: 6px; font-size: 16px; }
  .file-info { margin-top: 12px; color: var(--muted); word-break: break-all; }
  .row { margin-top: 14px; }
  input[type="password"] {
    width: 100%;
    background: #101013;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    padding: 11px 13px;
    font-size: 15px;
    outline: none;
  }
  input[type="password"]:focus { border-color: var(--accent); }
  button {
    appearance: none;
    border: 0;
    border-radius: 10px;
    padding: 11px 16px;
    font-size: 15px;
    font-weight: 600;
    color: #06240f;
    background: var(--accent);
    cursor: pointer;
    margin: 14px 8px 0 0;
  }
  button.secondary {
    background: #2a2a2e;
    color: var(--text);
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .status { min-height: 22px; margin: 12px 0 0; color: var(--muted); }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--accent); }
  .status.busy { color: var(--warn); }
  .summary { color: var(--muted); margin-bottom: 12px; }
  .entries { display: grid; gap: 8px; }
  .entry {
    background: #101013;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 13px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    justify-content: space-between;
  }
  .entry-main { min-width: 0; }
  .entry-name { font-weight: 600; word-break: break-all; }
  .entry-usr { color: var(--muted); font-size: 13px; word-break: break-all; }
  .entry-meta {
    flex: none;
    color: var(--accent);
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    text-align: right;
    white-space: nowrap;
  }
  .hint { color: var(--muted); font-size: 13px; margin: 14px 0 0; }
  .warn { color: var(--warn); font-size: 13px; margin-top: 10px; }
  .actions { margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>BandTOTP-NEXT · Aegis 导入器</h1>
  <p class="sub">选择 Aegis 的明文导出或加密备份，在本机浏览器中转换为手环可导入的格式。备份与密码不会离开这台设备。</p>

  <section class="card">
    <label class="drop" id="drop">
      <strong id="dropTitle">点击选择或拖入 Aegis 备份</strong>
      <span>支持 .json：Aegis「导出」明文 / 加密备份 / 数据库文件</span>
      <input type="file" id="fileInput" accept=".json,application/json" hidden>
    </label>
    <div class="file-info" id="fileInfo"></div>

    <div class="row" id="passwordRow" hidden>
      <input type="password" id="password" placeholder="Aegis 备份密码" autocomplete="off" spellcheck="false">
    </div>

    <button id="decryptBtn" disabled>解密并解析</button>
    <p class="status" id="status"></p>
  </section>

  <section class="card" id="result" hidden>
    <div class="summary" id="summary"></div>
    <div class="entries" id="entries"></div>
    <div class="actions">
      <button id="downloadJson">下载 .band.json</button>
      <button class="secondary" id="downloadTxt">下载 .otpauth.txt</button>
      <button class="secondary" id="copyJson">复制 JSON</button>
    </div>
    <p class="hint">旧版 BandTOTP 手机客户端只识别 .otpauth.txt 中的 TOTP 条目；Steam / HOTP / Yandex / mOTP 请发送 .band.json 的内容。</p>
  </section>
</main>

<script id="scrypt-lib">
/*
 * 纯 JavaScript scrypt（RFC 7914）。
 * PBKDF2 由调用方注入：浏览器使用 WebCrypto，测试使用 Node crypto。
 */
var ScryptLite = (function () {
  'use strict';

  function rotl(value, shift) {
    return ((value << shift) | (value >>> (32 - shift))) >>> 0;
  }

  function salsa20_8(input) {
    var x0 = input[0], x1 = input[1], x2 = input[2], x3 = input[3];
    var x4 = input[4], x5 = input[5], x6 = input[6], x7 = input[7];
    var x8 = input[8], x9 = input[9], x10 = input[10], x11 = input[11];
    var x12 = input[12], x13 = input[13], x14 = input[14], x15 = input[15];

    for (var i = 0; i < 4; i++) {
      x4 ^= rotl((x0 + x12) | 0, 7);
      x8 ^= rotl((x4 + x0) | 0, 9);
      x12 ^= rotl((x8 + x4) | 0, 13);
      x0 ^= rotl((x12 + x8) | 0, 18);

      x9 ^= rotl((x5 + x1) | 0, 7);
      x13 ^= rotl((x9 + x5) | 0, 9);
      x1 ^= rotl((x13 + x9) | 0, 13);
      x5 ^= rotl((x1 + x13) | 0, 18);

      x14 ^= rotl((x10 + x6) | 0, 7);
      x2 ^= rotl((x14 + x10) | 0, 9);
      x6 ^= rotl((x2 + x14) | 0, 13);
      x10 ^= rotl((x6 + x2) | 0, 18);

      x3 ^= rotl((x15 + x11) | 0, 7);
      x7 ^= rotl((x3 + x15) | 0, 9);
      x11 ^= rotl((x7 + x3) | 0, 13);
      x15 ^= rotl((x11 + x7) | 0, 18);

      x1 ^= rotl((x0 + x3) | 0, 7);
      x2 ^= rotl((x1 + x0) | 0, 9);
      x3 ^= rotl((x2 + x1) | 0, 13);
      x0 ^= rotl((x3 + x2) | 0, 18);

      x6 ^= rotl((x5 + x4) | 0, 7);
      x7 ^= rotl((x6 + x5) | 0, 9);
      x4 ^= rotl((x7 + x6) | 0, 13);
      x5 ^= rotl((x4 + x7) | 0, 18);

      x11 ^= rotl((x10 + x9) | 0, 7);
      x8 ^= rotl((x11 + x10) | 0, 9);
      x9 ^= rotl((x8 + x11) | 0, 13);
      x10 ^= rotl((x9 + x8) | 0, 18);

      x12 ^= rotl((x15 + x14) | 0, 7);
      x13 ^= rotl((x12 + x15) | 0, 9);
      x14 ^= rotl((x13 + x12) | 0, 13);
      x15 ^= rotl((x14 + x13) | 0, 18);
    }

    input[0] = (input[0] + x0) | 0;
    input[1] = (input[1] + x1) | 0;
    input[2] = (input[2] + x2) | 0;
    input[3] = (input[3] + x3) | 0;
    input[4] = (input[4] + x4) | 0;
    input[5] = (input[5] + x5) | 0;
    input[6] = (input[6] + x6) | 0;
    input[7] = (input[7] + x7) | 0;
    input[8] = (input[8] + x8) | 0;
    input[9] = (input[9] + x9) | 0;
    input[10] = (input[10] + x10) | 0;
    input[11] = (input[11] + x11) | 0;
    input[12] = (input[12] + x12) | 0;
    input[13] = (input[13] + x13) | 0;
    input[14] = (input[14] + x14) | 0;
    input[15] = (input[15] + x15) | 0;
  }

  function blockMix(B, offset, r, Y, X) {
    var last = offset + (2 * r - 1) * 16;
    var i, j;

    for (i = 0; i < 16; i++) X[i] = B[last + i];

    for (i = 0; i < 2 * r; i++) {
      for (j = 0; j < 16; j++) X[j] ^= B[offset + i * 16 + j];
      salsa20_8(X);
      for (j = 0; j < 16; j++) Y[i * 16 + j] = X[j];
    }

    for (i = 0; i < r; i++) {
      for (j = 0; j < 16; j++) B[offset + i * 16 + j] = Y[(2 * i) * 16 + j];
    }
    for (i = 0; i < r; i++) {
      for (j = 0; j < 16; j++) B[offset + (r + i) * 16 + j] = Y[(2 * i + 1) * 16 + j];
    }
  }

  function romix(B, offset, N, r, V, Y, X) {
    var blockWords = 32 * r;
    var i, j, k;

    for (i = 0; i < N; i++) {
      for (k = 0; k < blockWords; k++) V[i * blockWords + k] = B[offset + k];
      blockMix(B, offset, r, Y, X);
    }

    for (i = 0; i < N; i++) {
      j = B[offset + (2 * r - 1) * 16] % N;
      for (k = 0; k < blockWords; k++) B[offset + k] ^= V[j * blockWords + k];
      blockMix(B, offset, r, Y, X);
    }
  }

  function bytesToWordsLE(bytes) {
    var words = new Uint32Array(bytes.length >>> 2);
    for (var i = 0; i < words.length; i++) {
      words[i] = (bytes[i * 4] |
        (bytes[i * 4 + 1] << 8) |
        (bytes[i * 4 + 2] << 16) |
        (bytes[i * 4 + 3] << 24)) >>> 0;
    }
    return words;
  }

  function wordsToBytesLE(words, bytes) {
    for (var i = 0; i < words.length; i++) {
      bytes[i * 4] = words[i] & 0xff;
      bytes[i * 4 + 1] = (words[i] >>> 8) & 0xff;
      bytes[i * 4 + 2] = (words[i] >>> 16) & 0xff;
      bytes[i * 4 + 3] = (words[i] >>> 24) & 0xff;
    }
    return bytes;
  }

  function validateParams(N, r, p, dkLen) {
    if (!Number.isInteger(N) || N < 2 || (N & (N - 1)) !== 0) {
      throw new Error('scrypt N 必须是大于 1 的 2 的幂');
    }
    if (!Number.isInteger(r) || r < 1 || r > 32) throw new Error('scrypt r 参数异常');
    if (!Number.isInteger(p) || p < 1 || p > 16) throw new Error('scrypt p 参数异常');
    if (!Number.isInteger(dkLen) || dkLen < 1 || dkLen > 1024) throw new Error('scrypt 输出长度异常');
    if (N > (1 << 20) || 128 * N * r > 1024 * 1024 * 1024) {
      throw new Error('scrypt 参数所需内存过大');
    }
  }

  async function derive(passwordBytes, saltBytes, N, r, p, dkLen, pbkdf2) {
    validateParams(N, r, p, dkLen);

    var blockSize = 128 * r;
    var initial = await pbkdf2(passwordBytes, saltBytes, 1, p * blockSize);
    var B = new Uint8Array(initial);
    var B32 = bytesToWordsLE(B);

    var V = new Uint32Array(N * 32 * r);
    var Y = new Uint32Array(32 * r);
    var X = new Uint32Array(16);

    for (var i = 0; i < p; i++) {
      romix(B32, i * 32 * r, N, r, V, Y, X);
    }

    wordsToBytesLE(B32, B);
    return new Uint8Array(await pbkdf2(passwordBytes, B, 1, dkLen));
  }

  return { derive: derive };
})();
</script>

<script id="aegis-lib">
/* Aegis 解密与格式转换（纯函数，便于单独测试）。 */
var AegisLib = (function () {
  'use strict';

  var HEX_RE = /^[0-9a-fA-F]+$/;

  function hexToBytes(value, label) {
    var hex = String(value || '').trim();
    if (!hex || hex.length % 2 !== 0 || !HEX_RE.test(hex)) {
      throw new Error((label || '字段') + ' 不是合法的十六进制数据');
    }
    var bytes = new Uint8Array(hex.length / 2);
    for (var i = 0; i < bytes.length; i++) {
      bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
    }
    return bytes;
  }

  function base64ToBytes(value) {
    var str = String(value || '').replace(/\s/g, '').replace(/-/g, '+').replace(/_/g, '/');
    if (typeof atob === 'function') {
      var binary = atob(str);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }
    // Node 测试环境
    return new Uint8Array(Buffer.from(str, 'base64'));
  }

  function bytesToBase32(bytes) {
    var alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
    var out = '';
    var buffer = 0;
    var bits = 0;
    for (var i = 0; i < bytes.length; i++) {
      buffer = (buffer << 8) | bytes[i];
      bits += 8;
      while (bits >= 5) {
        bits -= 5;
        out += alphabet[(buffer >>> bits) & 0x1f];
      }
      if (bits > 0) buffer &= (1 << bits) - 1;
    }
    if (bits > 0) out += alphabet[(buffer << (5 - bits)) & 0x1f];
    return out;
  }

  function base32DecodeBytes(value) {
    var alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
    var str = String(value || '').toUpperCase().replace(/[\s\-]/g, '').replace(/=+$/, '');
    if (!str) throw new Error('密钥为空');
    var bytes = [];
    var buffer = 0;
    var bits = 0;
    for (var i = 0; i < str.length; i++) {
      var idx = alphabet.indexOf(str[i]);
      if (idx < 0) throw new Error('密钥包含无效的 Base32 字符');
      buffer = (buffer << 5) | idx;
      bits += 5;
      while (bits >= 8) {
        bits -= 8;
        bytes.push((buffer >>> bits) & 0xff);
      }
      if (bits > 0) buffer &= (1 << bits) - 1;
    }
    return new Uint8Array(bytes);
  }

  function normalizeAlgorithm(value, fallback) {
    var algo = String(value || '').toUpperCase().replace(/[\s_-]/g, '').replace(/^HMAC/, '');
    if (algo === 'SHA1' || algo === 'SHA256' || algo === 'SHA512' || algo === 'MD5') return algo;
    return fallback || 'SHA1';
  }

  function normalizeDigits(value, fallback) {
    var n = parseInt(value, 10);
    if (!Number.isFinite(n) || n < 1 || n > 10) return fallback;
    return n;
  }

  function normalizePeriod(value, fallback) {
    var n = parseInt(value, 10);
    if (!Number.isFinite(n) || n < 1 || n > 86400) return fallback;
    return n;
  }

  function convertEntry(entry) {
    if (!entry || typeof entry !== 'object') return null;
    var type = String(entry.type || '').toLowerCase();
    if (['totp', 'steam', 'hotp', 'yandex', 'motp'].indexOf(type) < 0) return null;

    var info = entry.info || {};
    var secret = String(info.secret || entry.key || '').replace(/[\s\-]/g, '').toUpperCase();
    if (!secret) return null;

    var algorithm = normalizeAlgorithm(info.algo, type === 'yandex' ? 'SHA256' : type === 'motp' ? 'MD5' : 'SHA1');
    var digits = normalizeDigits(info.digits, type === 'steam' ? 5 : type === 'yandex' ? 8 : 6);
    var period = normalizePeriod(info.period, type === 'motp' ? 10 : 30);

    if (type === 'motp') {
      algorithm = 'MD5';
      digits = 6;
      period = 10;
    } else if (type === 'yandex') {
      algorithm = 'SHA256';
      digits = 8;
    }

    var issuer = String(entry.issuer || '').trim();
    var account = String(entry.name || '').trim();
    var counter = Number(info.counter);
    if (!Number.isFinite(counter) || counter < 0) counter = 0;

    return {
      name: issuer || account,
      usr: issuer ? account : '',
      key: secret,
      type: type,
      algorithm: algorithm,
      digits: digits,
      period: period,
      counter: type === 'hotp' ? Math.floor(counter) : 0,
      pin: info.pin === null || info.pin === undefined ? '' : String(info.pin),
      favorite: entry.favorite === true
    };
  }

  function convertDb(db) {
    if (!db || !Array.isArray(db.entries)) throw new Error('Aegis 数据中缺少 entries 数组');
    var entries = [];
    var skipped = 0;
    for (var i = 0; i < db.entries.length; i++) {
      var converted = convertEntry(db.entries[i]);
      if (converted) entries.push(converted);
      else skipped++;
    }
    return { entries: entries, skipped: skipped };
  }

  async function decryptAesGcm(keyBytes, nonceBytes, ciphertext, tagBytes) {
    var key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
    var data = new Uint8Array(ciphertext.length + tagBytes.length);
    data.set(ciphertext, 0);
    data.set(tagBytes, ciphertext.length);
    var plain = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: nonceBytes, tagLength: 128 },
      key,
      data
    );
    return new Uint8Array(plain);
  }

  async function pbkdf2Web(passwordBytes, saltBytes, iterations, length) {
    var key = await crypto.subtle.importKey('raw', passwordBytes, 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', hash: 'SHA-256', salt: saltBytes, iterations: iterations },
      key,
      length * 8
    );
    return new Uint8Array(bits);
  }

  function isEncrypted(vaultFile) {
    return Boolean(
      vaultFile &&
      vaultFile.header &&
      Array.isArray(vaultFile.header.slots) &&
      vaultFile.header.slots.length > 0
    );
  }

  async function decryptVaultFile(vaultFile, password) {
    if (!vaultFile || typeof vaultFile !== 'object') throw new Error('备份不是有效的 JSON 对象');

    var header = vaultFile.header || {};
    var slots = Array.isArray(header.slots) ? header.slots : [];

    if (slots.length === 0) {
      if (typeof vaultFile.db === 'string') throw new Error('备份含有密文但缺少密码槽');
      return vaultFile.db;
    }

    if (typeof vaultFile.db !== 'string') throw new Error('加密备份的 db 字段应为 Base64 字符串');
    if (!password) throw new Error('该备份已加密，请输入密码');

    var passwordSlots = slots.filter(function (slot) { return slot && Number(slot.type) === 1; });
    if (passwordSlots.length === 0) throw new Error('备份中没有可用的密码槽');

    var passwordBytes = new TextEncoder().encode(password);
    var ciphertext = base64ToBytes(vaultFile.db);
    var params = header.params || {};
    var lastError = null;

    for (var i = 0; i < passwordSlots.length; i++) {
      var slot = passwordSlots[i];
      try {
        var keyParams = slot.key_params || {};
        var derived = await ScryptLite.derive(
          passwordBytes,
          hexToBytes(slot.salt, 'salt'),
          Number(slot.n),
          Number(slot.r),
          Number(slot.p),
          32,
          pbkdf2Web
        );
        var masterKey = await decryptAesGcm(
          derived,
          hexToBytes(keyParams.nonce, 'slot.nonce'),
          hexToBytes(slot.key, 'slot.key'),
          hexToBytes(keyParams.tag, 'slot.tag')
        );
        var plain = await decryptAesGcm(
          masterKey,
          hexToBytes(params.nonce, 'db.nonce'),
          ciphertext,
          hexToBytes(params.tag, 'db.tag')
        );
        return JSON.parse(new TextDecoder().decode(plain));
      } catch (error) {
        lastError = error;
      }
    }

    throw new Error('解密失败：密码错误或备份已损坏' + (lastError ? '（' + lastError.message + '）' : ''));
  }

  function entryToUri(entry) {
    var label = entry.name ? (entry.usr ? entry.name + ':' + entry.usr : entry.name) : (entry.usr || '');
    var encodedLabel = encodeURIComponent(label);

    if (entry.type === 'motp') {
      var secretBytes = base32DecodeBytes(entry.key);
      var hex = '';
      for (var i = 0; i < secretBytes.length; i++) {
        var h = secretBytes[i].toString(16);
        hex += h.length === 1 ? '0' + h : h;
      }
      var motpUri = 'motp://motp/' + encodedLabel + '?secret=' + hex;
      if (entry.pin) motpUri += '&pin=' + encodeURIComponent(entry.pin);
      return motpUri;
    }

    var host = entry.type === 'steam' ? 'steam' : entry.type === 'hotp' ? 'hotp' : entry.type === 'yandex' ? 'yaotp' : 'totp';
    var params = ['secret=' + encodeURIComponent(entry.key)];
    if (entry.name) params.push('issuer=' + encodeURIComponent(entry.name));
    params.push('algorithm=' + entry.algorithm);
    params.push('digits=' + entry.digits);
    if (entry.type === 'hotp') params.push('counter=' + entry.counter);
    else params.push('period=' + entry.period);
    if (entry.type === 'yandex' && entry.pin) {
      params.push('pin=' + encodeURIComponent(bytesToBase32(new TextEncoder().encode(String(entry.pin)))));
    }
    return 'otpauth://' + host + '/' + encodedLabel + '?' + params.join('&');
  }

  function toBandPayload(entries) {
    return { list: entries };
  }

  function toOtpauthText(entries) {
    return entries.map(entryToUri).join('\n') + '\n';
  }

  return {
    hexToBytes: hexToBytes,
    base64ToBytes: base64ToBytes,
    base32DecodeBytes: base32DecodeBytes,
    bytesToBase32: bytesToBase32,
    convertDb: convertDb,
    decryptVaultFile: decryptVaultFile,
    isEncrypted: isEncrypted,
    entryToUri: entryToUri,
    toBandPayload: toBandPayload,
    toOtpauthText: toOtpauthText
  };
})();
</script>

<script>
(function () {
  'use strict';

  var state = {
    fileName: '',
    vaultFile: null,
    entries: [],
    encrypted: false
  };

  var els = {
    drop: document.getElementById('drop'),
    dropTitle: document.getElementById('dropTitle'),
    fileInput: document.getElementById('fileInput'),
    fileInfo: document.getElementById('fileInfo'),
    passwordRow: document.getElementById('passwordRow'),
    password: document.getElementById('password'),
    decryptBtn: document.getElementById('decryptBtn'),
    status: document.getElementById('status'),
    result: document.getElementById('result'),
    summary: document.getElementById('summary'),
    entries: document.getElementById('entries'),
    downloadJson: document.getElementById('downloadJson'),
    downloadTxt: document.getElementById('downloadTxt'),
    copyJson: document.getElementById('copyJson')
  };

  function setStatus(text, kind) {
    els.status.textContent = text || '';
    els.status.className = 'status' + (kind ? ' ' + kind : '');
  }

  function resetResult() {
    state.entries = [];
    els.result.hidden = true;
    els.entries.textContent = '';
  }

  function readFile(file) {
    if (!file) return;
    state.fileName = file.name || 'aegis-backup.json';
    els.fileInfo.textContent = '已选择: ' + state.fileName;

    var reader = new FileReader();
    reader.onerror = function () {
      setStatus('读取文件失败', 'error');
    };
    reader.onload = function () {
      var text = String(reader.result || '');
      var parsed;
      try {
        parsed = JSON.parse(text);
      } catch (error) {
        setStatus('文件不是有效的 JSON: ' + error.message, 'error');
        els.decryptBtn.disabled = true;
        return;
      }

      state.vaultFile = parsed;
      state.encrypted = AegisLib.isEncrypted(parsed);
      els.passwordRow.hidden = !state.encrypted;
      els.decryptBtn.disabled = false;
      resetResult();

      if (state.encrypted) {
        setStatus('检测到加密备份，请输入密码后解密');
        els.password.focus();
      } else {
        setStatus('检测到明文备份，点击“解密并解析”');
      }
    };
    reader.readAsText(file, 'utf-8');
  }

  async function startParse() {
    if (!state.vaultFile) return;

    els.decryptBtn.disabled = true;
    resetResult();

    try {
      var db;
      if (state.encrypted) {
        var password = els.password.value;
        if (!password) {
          setStatus('请输入备份密码', 'error');
          els.decryptBtn.disabled = false;
          return;
        }
        setStatus('正在使用 scrypt 解密，大备份可能需要几秒…', 'busy');
        // 让浏览器先渲染状态文本，再开始占用主线程的计算
        await new Promise(function (resolve) { setTimeout(resolve, 40); });
        db = await AegisLib.decryptVaultFile(state.vaultFile, password);
        els.password.value = '';
      } else {
        setStatus('正在解析…', 'busy');
        await new Promise(function (resolve) { setTimeout(resolve, 20); });
        db = state.vaultFile.db !== undefined ? state.vaultFile.db : state.vaultFile;
      }

      var converted = AegisLib.convertDb(db);
      if (converted.entries.length === 0) {
        setStatus('没有找到可导入的令牌', 'error');
        els.decryptBtn.disabled = false;
        return;
      }

      state.entries = converted.entries;
      renderResult(converted);
      setStatus('解析完成，共 ' + converted.entries.length + ' 条令牌', 'ok');
    } catch (error) {
      setStatus(error.message || String(error), 'error');
    } finally {
      els.decryptBtn.disabled = false;
    }
  }

  function renderResult(converted) {
    els.entries.textContent = '';

    var typeCount = {};
    converted.entries.forEach(function (entry) {
      typeCount[entry.type] = (typeCount[entry.type] || 0) + 1;
    });

    var summaryParts = Object.keys(typeCount).map(function (type) {
      return type.toUpperCase() + ' ' + typeCount[type];
    });
    els.summary.textContent = '共 ' + converted.entries.length + ' 条：' + summaryParts.join(' / ') +
      (converted.skipped ? '；跳过 ' + converted.skipped + ' 条' : '');

    converted.entries.forEach(function (entry) {
      var row = document.createElement('div');
      row.className = 'entry';

      var main = document.createElement('div');
      main.className = 'entry-main';

      var name = document.createElement('div');
      name.className = 'entry-name';
      name.textContent = entry.name || '(未命名)';
      main.appendChild(name);

      if (entry.usr) {
        var usr = document.createElement('div');
        usr.className = 'entry-usr';
        usr.textContent = entry.usr;
        main.appendChild(usr);
      }

      var meta = document.createElement('div');
      meta.className = 'entry-meta';
      var metaParts = [entry.type.toUpperCase(), entry.algorithm, entry.digits + '位'];
      if (entry.type === 'hotp') metaParts.push('#' + entry.counter);
      else metaParts.push(entry.period + 's');
      if (entry.pin) metaParts.push('PIN');
      meta.textContent = metaParts.join('\n');

      row.appendChild(main);
      row.appendChild(meta);
      els.entries.appendChild(row);
    });

    els.result.hidden = false;
  }

  function download(filename, text) {
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function baseName() {
    return String(state.fileName || 'aegis-backup').replace(/\.[^.]+$/, '').replace(/[^A-Za-z0-9._-]/g, '_') || 'aegis-backup';
  }

  els.drop.addEventListener('click', function () { els.fileInput.click(); });
  els.fileInput.addEventListener('change', function () {
    readFile(els.fileInput.files && els.fileInput.files[0]);
  });

  ['dragenter', 'dragover'].forEach(function (name) {
    els.drop.addEventListener(name, function (event) {
      event.preventDefault();
      els.drop.classList.add('dragover');
    });
  });
  ['dragleave', 'drop'].forEach(function (name) {
    els.drop.addEventListener(name, function (event) {
      event.preventDefault();
      els.drop.classList.remove('dragover');
    });
  });
  els.drop.addEventListener('drop', function (event) {
    var file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
    readFile(file);
  });

  els.decryptBtn.addEventListener('click', function () { startParse(); });
  els.password.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') startParse();
  });

  els.downloadJson.addEventListener('click', function () {
    if (!state.entries.length) return;
    download(baseName() + '.band.json', JSON.stringify(AegisLib.toBandPayload(state.entries), null, 2));
  });

  els.downloadTxt.addEventListener('click', function () {
    if (!state.entries.length) return;
    download(baseName() + '.otpauth.txt', AegisLib.toOtpauthText(state.entries));
  });

  els.copyJson.addEventListener('click', async function () {
    if (!state.entries.length) return;
    var text = JSON.stringify(AegisLib.toBandPayload(state.entries), null, 2);
    try {
      await navigator.clipboard.writeText(text);
      setStatus('已复制到剪贴板', 'ok');
    } catch (error) {
      download(baseName() + '.band.json', text);
      setStatus('浏览器不允许剪贴板访问，已改为下载文件', 'error');
    }
  });
})();
</script>
</body>
</html>
