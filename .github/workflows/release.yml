name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，例如 2.0.0；留空则使用 package.json 中的版本
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AIOT_TOOLKIT_VERSION: "2.0.5"

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${RELEASE_TAG:-}}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="$(node -p "require('./package.json').version")"
          fi
          IFS=. read -r major minor patch <<< "$version"
          code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "Building BandTOTP-NEXT $version (versionCode $code)"

  watch:
    name: Build Vela RPK
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install aiot-toolkit
        run: npm install --global "aiot-toolkit@${AIOT_TOOLKIT_VERSION}"

      - name: Set manifest version
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const file = 'src/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          manifest.versionName = process.env.VERSION;
          manifest.versionCode = Number(process.env.VERSION_CODE);
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          node -p "'manifest: ' + require('./src/manifest.json').versionName + ' (' + require('./src/manifest.json').versionCode + ')'"

      - name: Prepare signing material
        env:
          VELA_CERT_PEM: ${{ secrets.VELA_CERT_PEM }}
          VELA_PRIVATE_PEM: ${{ secrets.VELA_PRIVATE_PEM }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$VELA_CERT_PEM" ]; then
            echo "::error::缺少 secret VELA_CERT_PEM"
            missing=1
          fi
          if [ -z "$VELA_PRIVATE_PEM" ]; then
            echo "::error::缺少 secret VELA_PRIVATE_PEM"
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1
          mkdir -p sign
          printf '%s' "$VELA_CERT_PEM" > sign/certificate.pem
          printf '%s' "$VELA_PRIVATE_PEM" > sign/private.pem
          chmod 600 sign/certificate.pem sign/private.pem

      - name: Build signed RPK
        run: aiot release

      - name: Rename RPK
        run: |
          set -euo pipefail
          rpk="$(find dist -maxdepth 1 -type f -name '*.rpk' -print -quit)"
          [ -n "$rpk" ] || { echo "::error::未找到 RPK 产物"; exit 1; }
          mv "$rpk" "BandTOTP-NEXT-${VERSION}.rpk"
          rm -rf sign

      - uses: actions/upload-artifact@v4
        with:
          name: watch-rpk
          path: BandTOTP-NEXT-${{ needs.prepare.outputs.version }}.rpk
          if-no-files-found: error

  android:
    name: Build Android APK
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_path="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager_path" ]; then
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -n 1)"
          fi
          [ -n "$sdkmanager_path" ] || { echo "::error::未找到 sdkmanager"; exit 1; }
          echo "sdkmanager: $sdkmanager_path"
          "$sdkmanager_path" --version 2>&1 | tail -n 3 || true
          ls -la "$sdk_root/cmdline-tools/" || true
          cat "$sdk_root/cmdline-tools/latest/source.properties" 2>/dev/null || true

          yes | "$sdkmanager_path" --licenses > /dev/null || true
          "$sdkmanager_path" --list > /tmp/sdkmanager-list.txt 2>&1 || true
          echo "--- available platforms ---"
          grep -E "platforms;android-3[0-9]" /tmp/sdkmanager-list.txt | head -n 15 || true
          echo "--- available cmdline-tools ---"
          grep -E "cmdline-tools" /tmp/sdkmanager-list.txt | head -n 10 || true
          if ! grep -q "platforms;android-37" /tmp/sdkmanager-list.txt; then
            echo "当前 sdkmanager 未提供 android-37，安装 cmdline-tools;19.0"
            "$sdkmanager_path" --install "cmdline-tools;19.0"
            sdkmanager_path="$sdk_root/cmdline-tools/19.0/bin/sdkmanager"
          fi
          [ -x "$sdkmanager_path" ] || { echo "::error::未找到可用的 sdkmanager: $sdkmanager_path"; exit 1; }
          echo "using: $sdkmanager_path"
          "$sdkmanager_path" --version 2>&1 | tail -n 3 || true
          yes | "$sdkmanager_path" --licenses > /dev/null || true
          "$sdkmanager_path" --install "platforms;android-37" "build-tools;37.0.0"

      - name: Prepare signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 secret $name"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          mkdir -p sync-app/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > sync-app/keystore/release.p12
          chmod 600 sync-app/keystore/release.p12

          {
            printf 'storeFile=keystore/release.p12\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > sync-app/keystore.properties

      - name: Build release APK
        working-directory: sync-app
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$VERSION_CODE"

      - name: Rename APK
        run: |
          set -euo pipefail
          apk="$(find sync-app/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [ -n "$apk" ] || { echo "::error::未找到 APK 产物"; exit 1; }
          mv "$apk" "BandTOTP-NEXT-Android-${VERSION}.apk"
          rm -f sync-app/keystore.properties
          rm -rf sync-app/keystore

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: BandTOTP-NEXT-Android-${{ needs.prepare.outputs.version }}.apk
          if-no-files-found: error

  publish:
    name: Attach assets to release
    if: github.event_name == 'release'
    needs: [prepare, watch, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          ls -l artifacts
          gh release upload "$TAG" artifacts/* --clobber
